[package]
name = "tsscam"
version = "0.1.0"
edition = "2024"
description = "TSS Cam: your phone as a handheld camera in BeamNG.drive and Assetto Corsa"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.4"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
