<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TSS Cam</title>
<link rel="stylesheet" id="theme" href="style.css">
<script>{const st=new URLSearchParams(location.search).get("style");if(st&&/^[a-z]+$/.test(st))document.getElementById("theme").href=`style-${st}.css`;}</script>
</head>
<body>
<canvas id="ambient" width="64" height="40" aria-hidden="true"></canvas>
<header class="topbar">
  <div class="tb-left"><span class="logo">TSS<b>CAM</b></span><span class="tb-sep"></span><span class="mono dim">RECEIVER</span></div>
  <div class="tb-mid mono" id="tbMode">AUTO</div>
  <div class="tb-right mono"><span class="tally" id="tally">STBY</span><span id="timecode">00:00:00:00</span></div>
</header>

<div class="body">
  <section class="monitor">
    <div class="image" id="image"></div>
    <div class="guides" aria-hidden="true"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i><i class="cross"></i></div>
    <div class="slate">
      <div class="mono label" id="slateLabel">STANDBY</div>
      <h1 id="slateTitle">Waiting for the phone</h1>
      <p class="mono dim" id="slateSub">ENTER THIS PC'S ADDRESS IN THE APP</p>
      <div class="actions">
        <button class="key primary" id="recenter">RECENTER</button>
        <button class="key" id="freeze">FREEZE</button>
        <button class="key hidden" id="accept">USE NEW PHONE</button>
      </div>
    </div>
    <div class="mono corner-id" id="cornerId">A001</div>
  </section>

  <aside class="menu">
    <div class="menu-head mono">GAME</div>
    <button class="row" data-mode="auto"><span class="caret">▶</span><span class="thumb auto"></span><span class="name">AUTO</span><span class="val mono" data-state>DETECT</span></button>
    <button class="row" data-mode="beamng"><span class="caret">▶</span><span class="thumb" style="background-image:url(/art/beamng.jpg)"></span><span class="name">BEAMNG.DRIVE</span><span class="val mono" data-state></span></button>
    <button class="row" data-mode="assetto"><span class="caret">▶</span><span class="thumb" style="background-image:url(/art/assetto.jpg)"></span><span class="name">ASSETTO CORSA</span><span class="val mono" data-state></span></button>

    <div class="menu-head mono">CONNECT</div>
    <div class="addr mono" id="addr">-</div>
    <div class="line mono dim">UDP <span id="port">47820</span> · <span id="fw">FIREWALL ?</span></div>
    <button class="key small hidden" id="firewall">ALLOW THROUGH FIREWALL</button>

    <div class="menu-head mono">CAR</div>
    <div class="big" id="car">NO CAR</div>
    <div class="line mono dim" id="carLine">START A GAME WITH THE TSS CAM MOD</div>

    <div class="menu-head mono">LIVE VIEW</div>
    <div class="line mono" id="liveLine">OFF</div>
  </aside>
</div>

<footer class="readouts mono">
  <div class="cell"><span class="k">PHONE</span><span class="v" id="rPhone">--</span></div>
  <div class="cell"><span class="k">RATE</span><span class="v" id="rRate">-- HZ</span></div>
  <div class="cell"><span class="k">LATENCY</span><span class="v" id="rLat">-- MS</span></div>
  <div class="cell"><span class="k">LOSS</span><span class="v" id="rLoss">-- %</span></div>
  <div class="cell"><span class="k">LENS</span><span class="v" id="rLens">24MM</span></div>
  <div class="cell"><span class="k">TRACK</span><span class="v" id="rTrack">--</span></div>
  <div class="cell grow"><span class="k">LINK</span><span class="v" id="rLink">--</span></div>
</footer>
<script src="app.js"></script>
</body>
</html>
